<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boulder-Wettkampf</title>
<style>
:root{--bg:#eef1f2;--card:#fff;--ink:#1c272d;--mute:#5f6f77;--line:#d3dadd;--flash:#e8a800;--on:#fff;--cat:#238a5b}
@media (prefers-color-scheme:dark){:root{--bg:#13181b;--card:#1d2529;--ink:#eaf0f2;--mute:#94a4ac;--line:#33414a;--flash:#f2b81c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:20px 0 12px}
h2{font-size:1.1rem;margin:0 0 10px}
nav{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 0;font:inherit;font-weight:700;color:var(--mute);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flash);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
select,input{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.cats,.ranktabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.cats button,.seg button,.ranktabs button{min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-weight:650;cursor:pointer}
.cats button[aria-pressed="true"],.ranktabs button[aria-pressed="true"]{background:var(--cat);border-color:var(--cat);color:var(--on)}
button:disabled{opacity:.45;cursor:not-allowed}
.hint,.msg{color:var(--mute);font-size:.9rem;margin:0 0 10px}
.msg{color:#c0392b;font-weight:600;min-height:1.2em}
#err{display:none;background:#c0392b;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:600}
.lock{background:var(--flash);color:#1c272d;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:650}
.me{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.me b{flex:1;font-size:1.1rem}
.me button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:8px}
.chip{background:var(--cat);color:var(--on);border-radius:99px;padding:2px 12px;font-weight:700;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hold{min-width:46px;height:42px;padding:0 8px;background:var(--cat);color:var(--on);border-radius:46% 54% 52% 48%/55% 45% 58% 42%;display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.hd .t{flex:1;font-weight:700}
.hd .t small{display:block;color:var(--mute);font-weight:400;font-size:.85rem}
.x{background:var(--flash);color:#1c272d;border-radius:8px;padding:1px 7px;font-size:.85rem;font-weight:800;margin-left:6px}
.pts{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 14px 14px}
.seg button[aria-pressed="true"]{background:var(--cat);border-color:var(--cat);color:var(--on)}
.seg button.f[aria-pressed="true"]{background:var(--flash);border-color:var(--flash);color:#1c272d}
ol{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.row.mine{border:2px solid var(--cat)}
.rk{width:2ch;font-weight:800;font-size:1.2rem;text-align:center;font-variant-numeric:tabular-nums}
.nm{flex:1;font-weight:650}
.nm small{display:block;color:var(--mute);font-weight:400;font-size:.85rem}
.sc{font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Boulder-Wettkampf</h1>
  <nav role="tablist">
    <button role="tab" data-a="tab" data-v="enter">Eintragen</button>
    <button role="tab" data-a="tab" data-v="rank">Rangliste</button>
  </nav>
  <div id="err" role="alert"></div>
  <main id="view"></main>
</div>
<script>
const SUPABASE_URL = 'https://usiwuachkmzixosavkel.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lWFB7mTv5QY0TIYaxm54BA_USrdZEHE';
const BASE = 1000;        // Punkte, wenn genau eine Person den Boulder schafft
const FLASH_BONUS = 0.10; // Flash zählt 10 % mehr
const POLL_MS = 5000;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toString().replace('.', ',');
const textOn = h => { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) > 150 ? '#10181c' : '#fff'; };
const catStyle = c => `--cat:${c.color};--on:${textOn(c.color)}`;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
async function api(path, opt = {}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opt, headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json().catch(() => null);
}

let cats = [], boulders = [], people = [], results = [], open = true, loaded = false, err = '';
let me = store.get('bw_me'), tab = 'enter', rankCat = '', joinCat = '';
const catOf = id => cats.find(c => c.id === id);

function stats(cid) {
  const bs = boulders.filter(b => b.category_id === cid).sort((a, b) => a.number - b.number);
  const inCat = people.filter(p => p.category_id === cid);
  const ids = new Set(inCat.map(p => p.id));
  const tops = {}; bs.forEach(b => tops[b.id] = 0);
  results.forEach(r => { if (ids.has(r.participant_id) && r.boulder_id in tops) tops[r.boulder_id]++; });
  const pts = {}; bs.forEach(b => pts[b.id] = BASE / Math.max(1, tops[b.id]) * Number(b.factor));
  const rows = inCat.map(p => {
    const mine = results.filter(r => r.participant_id === p.id && r.boulder_id in pts);
    const score = mine.reduce((s, r) => s + pts[r.boulder_id] * (r.flash ? 1 + FLASH_BONUS : 1), 0);
    return { p, score, tops: mine.length, flashes: mine.filter(r => r.flash).length };
  }).sort((a, b) => b.score - a.score || b.flashes - a.flashes || a.p.name.localeCompare(b.p.name, 'de'));
  rows.forEach((r, i) => {
    const prev = rows[i - 1];
    r.rank = r.score === 0 ? '–' : (prev && Math.round(prev.score) === Math.round(r.score) ? prev.rank : i + 1);
  });
  return { bs, tops, pts, rows };
}

const optsHtml = () => '<option value="">Name wählen</option>' +
  people.map(p => `<option value="${p.id}">${esc(p.name)} (${esc((catOf(p.category_id) || {}).name || '')})</option>`).join('');

function loginView() {
  const cb = cats.map(c => `<button data-a="cat" data-v="${c.id}" style="${catStyle(c)}" aria-pressed="${joinCat === c.id}">${esc(c.name)}</button>`).join('');
  return `
  ${open ? '' : '<div class="lock">Das Eintragen ist gesperrt. Neue Anmeldungen sind nicht mehr möglich.</div>'}
  <section class="panel">
    <h2>Du bist schon dabei?</h2>
    <select id="pick">${optsHtml()}</select>
    <button class="btn" data-a="pick">Weiter</button>
  </section>
  <section class="panel">
    <h2>Neu dabei?</h2>
    <input id="nm" maxlength="40" placeholder="Dein Name" autocomplete="off">
    <div class="cats">${cb}</div>
    <p class="hint">Die Kategorie gilt für den ganzen Wettkampf.</p>
    <p class="msg" id="msg"></p>
    <button class="btn" data-a="join" ${open ? '' : 'disabled'}>Anmelden</button>
  </section>`;
}

function enterView() {
  if (!loaded) return '<p class="hint">Lädt …</p>';
  if (!cats.length) return '<p class="hint">Der Wettkampf ist noch nicht eingerichtet.</p>';
  const p = people.find(x => x.id === me);
  if (!p) return loginView();
  const c = catOf(p.category_id), s = stats(c.id), mine = {}, dis = open ? '' : 'disabled';
  results.filter(r => r.participant_id === p.id).forEach(r => mine[r.boulder_id] = r.flash ? 'flash' : 'top');
  let h = open ? '' : '<div class="lock">Das Eintragen ist gesperrt. Du kannst nichts mehr ändern.</div>';
  h += `<div class="me" style="${catStyle(c)}"><b>${esc(p.name)}</b><span class="chip">${esc(c.name)}</span><button data-a="leave">Nicht ich</button></div>`;
  s.bs.forEach(b => {
    const v = mine[b.id] || 'none', f = Number(b.factor);
    const pts = Math.round(s.pts[b.id] * (v === 'flash' ? 1 + FLASH_BONUS : 1));
    h += `<article class="card" style="${catStyle(c)}">
      ${b.photo_url ? `<img src="${esc(b.photo_url)}" alt="Foto von Boulder ${b.number}" loading="lazy" onerror="this.remove()">` : ''}
      <div class="hd"><span class="hold">${b.number}</span>
        <span class="t">Boulder ${b.number}${f !== 1 ? `<span class="x">×${fmt(f)}</span>` : ''}<small>${s.tops[b.id]} ${s.tops[b.id] === 1 ? 'Top' : 'Tops'} bisher</small></span>
        <span class="pts">${pts}</span></div>
      <div class="seg">
        <button ${dis} data-a="set" data-b="${b.id}" data-v="none" aria-pressed="${v === 'none'}">Offen</button>
        <button ${dis} data-a="set" data-b="${b.id}" data-v="top" aria-pressed="${v === 'top'}">Top</button>
        <button ${dis} class="f" data-a="set" data-b="${b.id}" data-v="flash" aria-pressed="${v === 'flash'}">Flash</button>
      </div></article>`;
  });
  return h;
}

function rankView() {
  if (!loaded) return '<p class="hint">Lädt …</p>';
  if (!cats.length) return '<p class="hint">Der Wettkampf ist noch nicht eingerichtet.</p>';
  const c = catOf(rankCat) || cats[0], s = stats(c.id);
  const tabs = cats.map(x => `<button data-a="rank" data-v="${x.id}" style="${catStyle(x)}" aria-pressed="${x.id === c.id}">${esc(x.name)}</button>`).join('');
  const rows = s.rows.map(r => `<li class="row${r.p.id === me ? ' mine' : ''}" style="${catStyle(c)}">
      <span class="rk">${r.rank}</span>
      <span class="nm">${esc(r.p.name)}<small>${r.tops} Tops, davon ${r.flashes} Flash</small></span>
      <span class="sc">${Math.round(r.score)}</span></li>`).join('');
  return `<div class="ranktabs">${tabs}</div>
    <p class="hint">Jeder Boulder zählt ${BASE} geteilt durch die Zahl der Tops, mal sein Faktor. Flash gibt ${Math.round(FLASH_BONUS * 100)} % extra.</p>
    ${rows ? `<ol>${rows}</ol>` : '<p class="hint">Noch niemand in dieser Kategorie angemeldet.</p>'}`;
}

function showErr() { const e = $('#err'); e.textContent = err; e.style.display = err ? 'block' : 'none'; }
function render() {
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === tab));
  $('#view').innerHTML = tab === 'enter' ? enterView() : rankView();
  showErr();
}

async function load() {
  try {
    const [a, b, c, d, e] = await Promise.all([
      api('categories?select=id,name,color,sort&order=sort,name'),
      api('boulders?select=id,category_id,number,factor,photo_url'),
      api('participants?select=id,name,category_id&order=name'),
      api('results?select=participant_id,boulder_id,flash&limit=5000'),
      api('settings?select=entries_open&id=eq.1')
    ]);
    cats = a || []; boulders = b || []; people = c || []; results = d || [];
    open = e && e[0] ? e[0].entries_open : true; err = '';
    if (!catOf(rankCat) && cats[0]) rankCat = cats[0].id;
    const first = !loaded; loaded = true;
    if (me && !people.some(p => p.id === me)) { me = null; store.del('bw_me'); }
    if (first || tab === 'rank' || me) render();
    else { const sel = $('#pick'); if (sel) { const v = sel.value; sel.innerHTML = optsHtml(); sel.value = v; } showErr(); }
  } catch (e) {
    err = 'Keine Verbindung zur Datenbank. Seite neu laden oder später noch einmal versuchen.';
    showErr();
  }
}

async function setRes(bid, v) {
  if (!open) return;
  const id = me;
  results = results.filter(r => !(r.participant_id === id && r.boulder_id === bid));
  if (v !== 'none') results.push({ participant_id: id, boulder_id: bid, flash: v === 'flash' });
  render();
  try {
    if (v === 'none') await api(`results?participant_id=eq.${id}&boulder_id=eq.${bid}`, { method: 'DELETE' });
    else await api('results?on_conflict=participant_id,boulder_id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ participant_id: id, boulder_id: bid, flash: v === 'flash' })
    });
  } catch (e) { err = 'Speichern fehlgeschlagen. Eventuell wurde das Eintragen gerade gesperrt.'; await load(); }
}

async function join() {
  const name = $('#nm').value.trim(), msg = $('#msg');
  if (!name) { msg.textContent = 'Bitte gib deinen Namen ein.'; return; }
  if (!joinCat) { msg.textContent = 'Bitte wähle eine Kategorie.'; return; }
  if (people.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    msg.textContent = 'Der Name ist schon vergeben. Wähle ihn oben in der Liste oder nimm einen anderen.'; return;
  }
  try {
    const r = await api('participants', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ name, category_id: joinCat }) });
    me = r[0].id; store.set('bw_me', me); people.push(r[0]); render();
  } catch (e) { msg.textContent = 'Anmeldung fehlgeschlagen. Eventuell ist das Eintragen gesperrt.'; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'tab') { tab = v; render(); }
  else if (a === 'rank') { rankCat = v; render(); }
  else if (a === 'set') setRes(b.dataset.b, v);
  else if (a === 'leave') { me = null; store.del('bw_me'); render(); }
  else if (a === 'cat') { joinCat = v; document.querySelectorAll('.cats button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); }
  else if (a === 'pick') { const id = $('#pick').value; if (id) { me = id; store.set('bw_me', me); render(); } }
  else if (a === 'join') join();
});

render();
load();
setInterval(load, POLL_MS);
</script>
</body>
</html>
